<!DOCTYPE html>
<html>
<head><title>Blog一覧</title></head>
<body>
    <h1>ブログ一覧（ORM版）</h1>
    {% for blog in blogs %}
        <div>
            <h2>{{ blog.title }}</h2>
            <p>{{ blog.body }}</p>
            <small>投稿者: {{ blog.user_name }}</small>
        </div>
        <hr>
    {% endfor %}
</body>
</html>
